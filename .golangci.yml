version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused),
  # plus a few cheap checks and some that keep functions simple.
  enable:
    - errorlint
    - fatcontext
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - modernize
    - nestif
    - unconvert
    - unparam
  settings:
    gocognit:
      # Default: 30
      min-complexity: 20
    gocyclo:
      # Default: 30
      min-complexity: 20
  exclusions:
    # Closing, removing and printing best-effort, as Go code conventionally does.
    presets:
      - std-error-handling
    rules:
      # Tests are long tables and checklists; complexity there isn't a smell.
      - path: _test\.go
        linters:
          - gocognit
          - gocyclo
      # Tests write fixtures and scripts with ordinary permissions; gosec
      # itself skips them unless asked.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt

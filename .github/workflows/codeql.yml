name: CodeQL

# CodeQL's static analysis of the Go code; its findings go to the Security
# tab. The code builds on Linux too, so it runs on the cheaper runner.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 6 * * 1" # Mondays, for queries added since the last push

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
